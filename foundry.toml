[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 10_000
via_ir = true

[fmt]
line_length = 120

# Gas scaling benchmarks in gas/ (not scanned by default `forge test`).
[profile.gas]
test = "gas"
src = "src"
out = "out"
libs = ["lib"]
memory_limit = 4294967296 # 4 GiB
gas_limit = 10000000000
optimizer = true
optimizer_runs = 10_000
via_ir = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
