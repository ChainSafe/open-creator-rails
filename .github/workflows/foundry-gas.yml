name: foundry-gas

on:
  pull_request:
    branches: [main]

jobs:
  gas-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Forge Snapshot Check
        run: FOUNDRY_PROFILE=gas forge snapshot --check --isolate
