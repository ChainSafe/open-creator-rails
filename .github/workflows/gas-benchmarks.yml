name: Gas Benchmarks

on:
  push:
    branches:
      - main
      - rob1997/gas-performance-tests

permissions:
  contents: write
  pull-requests: write

jobs:
  gas-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Update Gas Benchmarks
        run: |
          if git diff --quiet HEAD^ HEAD -- src/ gas/ foundry.toml; then
            exit 0
          fi

          ./scripts/gasBenchmarks.sh
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          MNEMONIC: ${{ secrets.MNEMONIC }}

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_USERNAME: ${{ github.actor }}
        run: |
          branch="gas-benchmarks/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git config user.name "$GIT_USERNAME"
          git config user.email "$GIT_USERNAME@users.noreply.github.com"
          git checkout -b "$branch"

          git add --ignore-missing .gas-snapshot snapshots/gas/ docs/gas-benchmarks.md

          if git diff --cached --quiet; then
            echo "No gas benchmark changes to commit."
            exit 0
          fi

          git commit -m "Gas benchmarks"
          git push origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Gas benchmarks" \
            --body "Updates gas snapshot artifacts and charts generated by the gas benchmarks workflow." \
            --assignee "$GIT_USERNAME"
