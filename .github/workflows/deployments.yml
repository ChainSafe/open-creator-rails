name: Deployments

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Seed
        run: |
          if git diff --quiet HEAD^ HEAD -- src/; then
            exit 0
          fi

          rm -rf deployments/*
          ./scripts/seed.sh
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          MNEMONIC: ${{ secrets.MNEMONIC }}

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_USERNAME: ${{ github.actor }}
        run: |
          branch="deployments/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git config user.name "$GIT_USERNAME"
          git config user.email "$GIT_USERNAME@users.noreply.github.com"
          git checkout -b "$branch"

          git add deployments/

          if git diff --cached --quiet; then
            echo "No deployment changes to commit."
            exit 0
          fi

          git commit -m "Deployments"
          git push origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Deployments" \
            --body "Updates deployment artifacts generated by the deployment workflow." \
            --assignee "$GIT_USERNAME"